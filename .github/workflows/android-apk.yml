name: Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode for the APK."
        required: true
        default: "1"
      version_name:
        description: "Android versionName shown in app settings."
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build APK
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_PROFILE: production
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: Physics AI Pro
          EXPO_PUBLIC_REVENUECAT_PRO_ENTITLEMENT_ID: Physics AI Pro
          EXPO_PUBLIC_REVENUECAT_BASIC_ENTITLEMENT_ID: Physics AI Basic
          EXPO_PUBLIC_REVENUECAT_BASIC_PRODUCT_ID: basic
          EXPO_PUBLIC_REVENUECAT_MONTHLY_PRODUCT_ID: monthly
          EXPO_PUBLIC_REVENUECAT_YEARLY_PRODUCT_ID: yearly
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease -PVERSION_CODE=${{ inputs.version_code }} -PVERSION_NAME=${{ inputs.version_name }} --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-ai-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
