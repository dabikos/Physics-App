name: Android Release AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode. Must be higher than the latest Google Play version code."
        required: true
        default: "17"
      version_name:
        description: "Android versionName shown in Google Play."
        required: true
        default: "1.0.0"
  push:
    branches:
      - codex/pro-subscription-access
    paths:
      - .github/workflows/android-release.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secrets. Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD."
            exit 1
          fi
          mkdir -p credentials/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > credentials/android/keystore.jks

      - name: Build signed app bundle
        env:
          NODE_ENV: production
          RELEASE_VERSION_CODE: ${{ github.event.inputs.version_code || '18' }}
          RELEASE_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.1' }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
          EXPO_PUBLIC_API_PROFILE: production
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: Physics AI Pro
          EXPO_PUBLIC_REVENUECAT_PRO_ENTITLEMENT_ID: Physics AI Pro
          EXPO_PUBLIC_REVENUECAT_BASIC_ENTITLEMENT_ID: Physics AI Basic
          EXPO_PUBLIC_REVENUECAT_BASIC_PRODUCT_ID: basic
          EXPO_PUBLIC_REVENUECAT_MONTHLY_PRODUCT_ID: monthly
          EXPO_PUBLIC_REVENUECAT_YEARLY_PRODUCT_ID: yearly
          MYAPP_UPLOAD_STORE_FILE: credentials/android/keystore.jks
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
            echo "org.gradle.daemon.performance.disable-logging=true"
          } >> android/gradle.properties
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease -PVERSION_CODE="$RELEASE_VERSION_CODE" -PVERSION_NAME="$RELEASE_VERSION_NAME" --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-ai-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
