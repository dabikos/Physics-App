name: Android Release AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode. Must be higher than the latest Google Play version code."
        required: true
        default: "17"
      version_name:
        description: "Android versionName shown in Google Play."
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Verify release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
        run: |
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD \
            EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY
          do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p credentials/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > credentials/android/keystore.jks

      - name: Build signed app bundle
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_PROFILE: production
          EXPO_PUBLIC_API_URL: https://physics-app-production-2585.up.railway.app
          EXPO_PUBLIC_ADS_TEST_MODE: "false"
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyCRT66ylCtCXTHD__X4Ag9bgpH-iwNdAm8
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: phus-a53ce.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: phus-a53ce
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: phus-a53ce.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "201868571438"
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:201868571438:android:acb1c655419231b70700bf
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 94754697830-4heqf86ar592sqoi9a8d2chks3rp3pes.apps.googleusercontent.com
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: Physics AI Pro
          EXPO_PUBLIC_REVENUECAT_PRO_ENTITLEMENT_ID: Physics AI Pro
          EXPO_PUBLIC_REVENUECAT_BASIC_ENTITLEMENT_ID: Physics AI Basic
          EXPO_PUBLIC_REVENUECAT_OFFERING_ID: default
          EXPO_PUBLIC_REVENUECAT_BASIC_PRODUCT_ID: basic
          EXPO_PUBLIC_REVENUECAT_MONTHLY_PRODUCT_ID: monthly
          EXPO_PUBLIC_REVENUECAT_YEARLY_PRODUCT_ID: yearly
          MYAPP_UPLOAD_STORE_FILE: credentials/android/keystore.jks
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease -PVERSION_CODE=${{ inputs.version_code }} -PVERSION_NAME=${{ inputs.version_name }} --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-ai-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
