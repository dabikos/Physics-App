name: iOS IPA (Unsigned / Sideload)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "iOS Version (CFBundleShortVersionString)"
        required: true
        default: "1.0.0"
      build_number:
        description: "iOS Build Number (CFBundleVersion)"
        required: true
        default: "1"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps

      - name: Prebuild iOS project
        env:
          EXPO_PUBLIC_API_PROFILE: production
          EXPO_PUBLIC_API_URL: https://physics-app-production-2585.up.railway.app
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: Physics AI Pro
          EXPO_PUBLIC_REVENUECAT_PRO_ENTITLEMENT_ID: Physics AI Pro
          EXPO_PUBLIC_REVENUECAT_BASIC_ENTITLEMENT_ID: Physics AI Basic
          EXPO_PUBLIC_REVENUECAT_BASIC_PRODUCT_ID: basic
          EXPO_PUBLIC_REVENUECAT_MONTHLY_PRODUCT_ID: monthly
          EXPO_PUBLIC_REVENUECAT_YEARLY_PRODUCT_ID: yearly
        run: |
          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS Archive (Unsigned)
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_PROFILE: production
          EXPO_PUBLIC_API_URL: https://physics-app-production-2585.up.railway.app
          EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_API_KEY }}
          EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: Physics AI Pro
          EXPO_PUBLIC_REVENUECAT_PRO_ENTITLEMENT_ID: Physics AI Pro
          EXPO_PUBLIC_REVENUECAT_BASIC_ENTITLEMENT_ID: Physics AI Basic
          EXPO_PUBLIC_REVENUECAT_BASIC_PRODUCT_ID: basic
          EXPO_PUBLIC_REVENUECAT_MONTHLY_PRODUCT_ID: monthly
          EXPO_PUBLIC_REVENUECAT_YEARLY_PRODUCT_ID: yearly
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | jq -r '.workspace.schemes[0]')
          echo "Building Workspace: $WORKSPACE with Scheme: $SCHEME"

          mkdir -p "$PWD/build"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/PhysicsAI.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION=${{ inputs.version_name }} \
            CURRENT_PROJECT_VERSION=${{ inputs.build_number }}

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(ls -d build/PhysicsAI.xcarchive/Products/Applications/*.app | head -n 1)
          echo "Packaging App: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -y PhysicsAI.ipa Payload
          ls -lh PhysicsAI.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-ai-ios-ipa
          path: frontend/build/PhysicsAI.ipa
          if-no-files-found: error
